<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f5ef" />
  <title>Dayline — 시간 위에 생각을 놓다</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-mark">D</div>
        <div>
          <div class="brand">Dayline</div>
          <div class="tagline">시간 위에 생각을 놓다</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="ghost" id="todayBtn">오늘</button>
        <button class="primary" id="newBtn">＋ 새 기록</button>
      </div>
    </header>

    <section class="timeline-section">
      <div class="timeline-meta">
        <div>
          <div class="eyebrow">TIMELINE</div>
          <h1 id="monthTitle"></h1>
        </div>
        <div class="timeline-nav">
          <button class="icon-btn" id="prevWeek" aria-label="이전">←</button>
          <button class="icon-btn" id="nextWeek" aria-label="다음">→</button>
        </div>
      </div>
      <div class="timeline-wrap" id="timelineWrap">
        <div class="timeline" id="timeline"></div>
      </div>
    </section>

    <main class="workspace">
      <section class="day-panel">
        <div class="day-heading">
          <div>
            <div class="eyebrow" id="selectedWeekday"></div>
            <h2 id="selectedDate"></h2>
          </div>
          <div class="count-pill" id="noteCount">0 records</div>
        </div>
        <div class="quick-capture">
          <textarea id="quickText" placeholder="생각나는 대로 적어보세요. 문장이 정리되어 있지 않아도 괜찮아요."></textarea>
          <div class="quick-actions">
            <div class="type-switch" id="typeSwitch">
              <button class="type active" data-type="note">메모</button>
              <button class="type" data-type="checklist">체크리스트</button>
              <button class="type" data-type="mindmap">마인드맵</button>
            </div>
            <div class="capture-buttons">
              <button class="ghost" id="organizeBtn">✨ 자동 정리</button>
              <button class="primary" id="saveBtn">기록하기</button>
            </div>
          </div>
        </div>
        <div id="notesList" class="notes-list"></div>
      </section>

      <aside class="insight-panel">
        <div class="insight-card">
          <div class="eyebrow">TODAY FLOW</div>
          <div class="flow-score" id="flowScore">0%</div>
          <div class="progress"><span id="flowBar"></span></div>
          <p id="flowText">체크리스트를 만들면 오늘의 흐름을 보여드려요.</p>
        </div>
        <div class="insight-card">
          <div class="eyebrow">AUTO ORGANIZE</div>
          <h3>흩어진 생각을 구조로</h3>
          <p>입력한 문장에서 할 일, 핵심 키워드, 제목 후보를 찾아 간단히 정리합니다.</p>
          <div class="chips" id="keywordChips"><span>#dayline</span><span>#timeline</span></div>
        </div>
        <div class="insight-card tip">
          <div class="tip-icon">↔</div>
          <div><strong>시간을 탐색하세요</strong><p>상단 타임라인을 가로로 스크롤하면 과거와 미래 기록을 빠르게 볼 수 있어요.</p></div>
        </div>
      </aside>
    </main>
  </div>

  <template id="noteTemplate">
    <article class="note-card">
      <div class="card-top">
        <div class="kind-badge"></div>
        <button class="delete-btn" title="삭제">×</button>
      </div>
      <h3 class="note-title"></h3>
      <div class="note-body"></div>
      <div class="note-footer"><div class="chips note-tags"></div><time></time></div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
